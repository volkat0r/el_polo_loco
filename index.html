<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Polo Loco</title>
    <link rel="stylesheet" href="./styles/standard.css" />
    <link rel="stylesheet" href="./styles/font-face.css" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./script.js"></script>
    <link
      rel="icon"
      type="image/x-icon"
      href="assets/icons/favicon-32x32.png"
    />
  </head>
  <body>
    <header>
      <h1>El Pollo Loco</h1>
    </header>
    <main>
      <div class="container">
        <canvas id="canvas" width="720" height="480"></canvas>
        <div class="overlay-symbols">
          <ul>
            <li class="fullscreen-btn-wrapper">
              <button
                class="fullscreen-btn"
                id="fullscreen-btn"
                type="button"
                aria-label="Fullscreen"
              >
                <img src="./assets/img/fullscreen.webp" alt="Fullscreen" />
              </button>
            </li>
            <li class="instructions-btn-wrapper">
              <button
                class="instructions-btn"
                id="instructions-open-btn"
                type="button"
                aria-label="Show Instructions"
              >
                i
              </button>
            </li>
            <li class="unmute">
              <img src="./assets/img/mute_button.webp" alt="Loud Button" />
            </li>
            <li class="mute">
              <img src="./assets/img/loud_button.webp" alt="Mute Button" />
            </li>
          </ul>
        </div>
        <div id="screen-overlay" class="screen-overlay">
          <img
            id="screen-result-image"
            class="screen-result-image hidden"
            alt=""
          />
          <h2 id="screen-title">El Pollo Loco</h2>
          <p id="screen-text">Ready? Start the game!</p>
          <div class="screen-overlay-actions">
            <button id="screen-btn" type="button">Start</button>
            <button
              id="screen-home-btn"
              type="button"
              class="hidden"
              aria-label="Go to Home"
            >
              <img src="./assets/img/home_btn.webp" alt="Home" />
            </button>
          </div>
        </div>

        <div class="touch-controls" aria-label="Touch Controls">
          <div class="touch-controls__left">
            <button class="touch-btn" id="touch-left" aria-label="Move Left">
              <img src="./assets/img/arrow-left.webp" alt="move left" />
            </button>
            <button class="touch-btn" id="touch-right" aria-label="Move Right">
              <img src="./assets/img/arrow-right.webp" alt="move right" />
            </button>
          </div>
          <div class="touch-controls__right">
            <button
              class="touch-btn"
              id="touch-throw"
              aria-label="Throw Bottle"
            >
              <img src="./assets/img/bottle_key.webp" alt="throw bottle" />
            </button>
            <button class="touch-btn" id="touch-jump" aria-label="Jump">
              <img src="./assets/img/jump-key.webp" alt="jump" />
            </button>
          </div>
        </div>
      </div>

      <div class="portrait-hint" aria-live="polite">
        <p>Rotate your device to landscape mode</p>
      </div>
    </main>

    <div
      id="instructions-modal"
      class="instructions-modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="instructions-title"
    >
      <div
        class="instructions-modal__backdrop"
        data-close-instructions="true"
      ></div>
      <div class="instructions-modal__panel">
        <button
          id="instructions-close-btn"
          class="instructions-close-btn"
          type="button"
          aria-label="Close Instructions"
        >
          ×
        </button>
        <div class="instructions">
          <h2 id="instructions-title">Instructions</h2>
          <ul>
            <li>
              left
              <img src="./assets/img/arrow-left.webp" alt="move left" /> or
              <img src="./assets/img/a-key.webp" alt="move left" />
            </li>
            <li>
              right
              <img src="./assets/img/arrow-right.webp" alt="move right" /> or
              <img src="./assets/img/d-key.webp" alt="move right" />
            </li>
            <li>
              jump
              <img src="./assets/img/arrow-jump.webp" alt="Jump" /> or
              <img src="./assets/img/w-key.webp" alt="Jump" /> or
              <img src="./assets/img/space-key.webp" alt="Jump" />
            </li>
            <li>
              throw bottle <img src="./assets/img/e-key.webp" alt="Throw" />
            </li>
          </ul>
        </div>
      </div>
    </div>

    <footer>
      <a class="inter-link" href="./imprint.html">Imprint</a>
    </footer>
  </body>
</html>
