<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Polo Loco</title>
    <link rel="stylesheet" href="./styles/standard.css" />
    <link rel="stylesheet" href="./styles/font-face.css" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./script.js"></script>
    <link
      rel="icon"
      type="image/x-icon"
      href="assets/icons/favicon-32x32.png"
    />
  </head>
  <body>
    <header>
      <h1>el Pollo Loco</h1>
    </header>
    <main>
      <div class="container">
        <canvas id="canvas" width="720" height="480"></canvas>
        <div class="overlay-symbols">
          <ul>
            <li class="fullscreen-btn-wrapper">
              <button
                class="fullscreen-btn"
                id="fullscreen-btn"
                type="button"
                aria-label="Vollbild"
              >
                <img src="./assets/img/fullscreen.webp" alt="Fullscreen" />
              </button>
            </li>
            <li class="unmute">
              <img src="./assets/img/loud_button.webp" alt="Loud Button" />
            </li>
            <li class="mute">
              <img src="./assets/img/mute_button.webp" alt="Mute Button" />
            </li>
          </ul>
        </div>
        <div id="screen-overlay" class="screen-overlay">
          <img
            id="screen-result-image"
            class="screen-result-image hidden"
            alt=""
          />
          <h2 id="screen-title">El Pollo Loco</h2>
          <p id="screen-text">Bereit? Starte das Spiel.</p>
          <button id="screen-btn" type="button">Start</button>
        </div>

        <div class="touch-controls" aria-label="Touch-Steuerung">
          <div class="touch-controls__left">
            <button
              class="touch-btn"
              id="touch-left"
              aria-label="Links bewegen"
            >
              <img src="./assets/img/arrow-left.webp" alt="move left" />
            </button>
            <button
              class="touch-btn"
              id="touch-right"
              aria-label="Rechts bewegen"
            >
              <img src="./assets/img/arrow-right.webp" alt="move right" />
            </button>
          </div>
          <div class="touch-controls__right">
            <button
              class="touch-btn"
              id="touch-throw"
              aria-label="Flasche werfen"
            >
              <img src="./assets/img/bottle_key.webp" alt="throw bottle" />
            </button>
            <button class="touch-btn" id="touch-jump" aria-label="Springen">
              <img src="./assets/img/jump-key.webp" alt="jump" />
            </button>
          </div>
        </div>
      </div>

      <div class="portrait-hint" aria-live="polite">
        <p>🔄 Drehe dein Gerät ins Querformat</p>
      </div>

      <div class="instructions">
        <h2>Instructions</h2>
        <ul>
          <li>
            left
            <img src="./assets/img/arrow-left.webp" alt="move left" /> or
            <img src="./assets/img/a-key.webp" alt="move left" />
          </li>
          <li>
            right
            <img src="./assets/img/arrow-right.webp" alt="move right" /> or
            <img src="./assets/img/d-key.webp" alt="move right" />
          </li>
          <li>
            jump
            <img src="./assets/img/arrow-jump.webp" alt="Jump" /> or
            <img src="./assets/img/w-key.webp" alt="Jump" /> or
            <img src="./assets/img/space-key.webp" alt="Jump" />
          </li>
          <li>
            throw bottle <img src="./assets/img/e-key.webp" alt="Throw" />
          </li>
        </ul>
      </div>
    </main>
    <footer>
      <a href="./imprint.html" style="color: var(--white)">Imprint</a>
    </footer>
  </body>
</html>
